name: Pricing Fallback Check

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    # This is a required production-eligibility check, so both direct main
    # pushes and pull requests must emit a result.

permissions:
  contents: read

concurrency:
  group: pricing-fallback-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify bundled pricing fallback snapshot
        shell: bash
        run: |
          set -euo pipefail
          if bash tools/pricing_fallback_sync.sh check; then
            echo 'Bundled pricing fallback is current.' >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo '## Pricing fallback update required'
              echo
              echo 'Run `tools/pricing_fallback_sync.sh sync` locally and submit the resulting change through a reviewed pull request.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
