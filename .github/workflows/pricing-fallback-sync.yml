name: Pricing Fallback Check

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    # Every pull request emits a result, but only pricing-contract changes
    # compare against the mutable upstream snapshot. Exact main commits remain
    # subject to the remote freshness gate before production eligibility.

permissions:
  contents: read

concurrency:
  group: pricing-fallback-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select remote freshness scope
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != pull_request ]]; then
            echo 'check_remote=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            .github/workflows/pricing-fallback-sync.yml \
            tools/pricing_fallback_sync.sh \
            backend/internal/config/config.go \
            backend/resources/model-pricing/model_prices_and_context_window.json; then
            echo 'check_remote=false' >> "$GITHUB_OUTPUT"
            {
              echo 'Bundled pricing files are unchanged in this pull request.'
              echo 'Remote freshness remains enforced on protected main, schedule, and manual runs.'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'check_remote=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Verify bundled pricing fallback snapshot
        if: steps.scope.outputs.check_remote == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if bash tools/pricing_fallback_sync.sh check; then
            echo 'Bundled pricing fallback is current.' >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo '## Pricing fallback update required'
              echo
              echo 'Run `tools/pricing_fallback_sync.sh sync` locally and submit the resulting change through a reviewed pull request.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
