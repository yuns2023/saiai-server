name: Pricing Fallback Check

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    # Every pull request emits a result. Snapshot or remote-URL changes compare
    # byte-for-byte against the mutable upstream; tooling changes and protected
    # main/schedule/manual runs use the semantic check, which fails only on an
    # unusable feed. Upstream drift alone never turns main red: running
    # Gateways bill from the remote feed, and the release-time Ops pricing gate
    # judges drift against production-billed keys.

permissions:
  contents: read

concurrency:
  # Per event, so a scheduled or manual run never cancels the push run that
  # release preparation requires for the exact main SHA.
  group: pricing-fallback-check-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test semantic pricing comparison
        run: python3 tools/test_pricing_fallback_diff.py

      - name: Select pricing check mode
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != pull_request ]]; then
            echo 'mode=semantic' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          snapshot=backend/resources/model-pricing/model_prices_and_context_window.json
          config=backend/internal/config/config.go
          # Prints the default remote URL only when exactly one is declared;
          # anything else (missing file, none, several) yields "" -> exact.
          remote_url() {
            local urls
            urls="$(git show "$1:$config" 2>/dev/null \
              | sed -n 's/.*viper.SetDefault("pricing.remote_url", "\(https:[^"]*\)").*/\1/p')" || true
            [[ -n "$urls" && "$(printf '%s\n' "$urls" | wc -l)" -eq 1 ]] && printf '%s' "$urls"
            return 0
          }
          base_url="$(remote_url "$BASE_SHA")"
          head_url="$(remote_url "$HEAD_SHA")"
          if ! git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- "$snapshot" \
            || [[ -z "$head_url" || "$base_url" != "$head_url" ]]; then
            # A snapshot sync or remote-URL change must be an exact copy.
            echo 'mode=exact' >> "$GITHUB_OUTPUT"
          elif ! git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            .github/workflows/pricing-fallback-sync.yml \
            tools/pricing_fallback_sync.sh \
            tools/pricing_fallback_diff.py \
            tools/test_pricing_fallback_diff.py; then
            echo 'mode=semantic' >> "$GITHUB_OUTPUT"
          else
            echo 'mode=skip' >> "$GITHUB_OUTPUT"
            {
              echo 'Bundled pricing files and tooling are unchanged in this pull request.'
              echo 'Main, schedule, and manual runs still validate the feeds semantically.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify bundled pricing fallback snapshot (exact)
        if: steps.scope.outputs.mode == 'exact'
        shell: bash
        run: |
          set -euo pipefail
          if bash tools/pricing_fallback_sync.sh check; then
            echo 'Bundled pricing fallback is an exact copy of the remote feed.' >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo '## Pricing fallback update required'
              echo
              echo 'This pull request changes the snapshot or remote URL, so it must be an exact copy.'
              echo 'Run `tools/pricing_fallback_sync.sh sync` again and push the result.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Validate bundled pricing fallback (semantic)
        if: steps.scope.outputs.mode == 'semantic'
        shell: bash
        run: |
          set -euo pipefail
          status=0
          bash tools/pricing_fallback_sync.sh check --semantic --github > semantic.txt || status=$?
          cat semantic.txt
          {
            echo '## Pricing fallback semantic check'
            echo
            echo '```'
            cat semantic.txt
            echo '```'
            echo
            echo 'Drift alone does not fail this check. Production billing impact is judged at release time by the Ops pricing gate.'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
