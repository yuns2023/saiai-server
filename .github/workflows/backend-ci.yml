name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.4
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: frontend
        run: pnpm run lint:check
      - name: Type check
        working-directory: frontend
        run: pnpm run typecheck
      - name: Unit tests
        working-directory: frontend
        run: pnpm exec vitest run --maxWorkers=2
      - name: Production build
        working-directory: frontend
        run: pnpm run build

  # Backend suites run as parallel matrix legs; the required "test" check is
  # the aggregate below, so branch protection and release gates are unchanged.
  backend-tests:
    name: backend-tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit
            run: make test-unit
          - suite: moderation-race
            run: >-
              CGO_ENABLED=1 GOMAXPROCS=2
              go test -race -tags=unit -p 1 ./internal/service ./internal/repository -run 'TestModeration' -parallel=2 -count=1 -timeout=180s
          - suite: ws-race
            run: >-
              export CGO_ENABLED=1 GOMAXPROCS=2 &&
              go test -race -tags=unit -p 1 ./internal/service/openai_ws_v2 -parallel=2 -count=1 -timeout=180s &&
              go test -race -tags=unit -p 1 ./internal/service -run 'Test(OpenAIWS|OpenAICodexNativeRelay|OpenAIGatewayService_.*WS|OpenAIGatewayService_ProxyResponsesWebSocket|OpenAIGatewayService_UpdateCodexUsageSnapshot|OpenAIGatewayService_GetSchedulableAccount_ExhaustedCodex|ParseOpenAIWSCodexRateLimitEvent|PrepareOpenAIWSContinuation|BuildOpenAIWSFailover|CalculateOpenAI429ResetTime|ParseOpenAIRateLimit)' -parallel=2 -count=1 -timeout=300s &&
              go test -race -tags=unit -p 1 ./internal/handler -run 'Test(OpenAIResponsesWebSocket|OpenAIGatewayHandler.*WSTurn)' -parallel=2 -count=1 -timeout=180s &&
              go test -race -tags=unit -p 1 ./internal/handler ./internal/service -run 'Test(SessionInitialSerial|UseSessionInitialSerial|ClaudeSticky|ClaudeOAuthSticky|ClaudeOAuthPendingSticky)' -parallel=2 -count=1 -timeout=180s
          - suite: integration
            run: make test-integration
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
          check-latest: false
          cache: true
      - name: Verify Go version
        run: go version | grep -q 'go1.26.10'
      - name: Run ${{ matrix.suite }}
        working-directory: backend
        run: ${{ matrix.run }}

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: backend-tests
    if: always()
    steps:
      - name: All backend suites passed
        env:
          RESULT: ${{ needs.backend-tests.result }}
        run: test "$RESULT" = success

  golangci-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
          check-latest: false
          cache: true
      - name: Verify Go version
        run: go version | grep -q 'go1.26.10'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.9
          args: --timeout=30m
          working-directory: backend

  release-config:
    name: release-config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify direct-main release workflow contract
        run: python3 scripts/validate-direct-main-release.py
      - name: Test resource-aware pre-push hook
        run: python3 tools/test_pre_push_hook.py
      - name: Check full GoReleaser configuration
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: v2.17.0
          args: check
        env:
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_OWNER_LOWER: ${{ github.repository_owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          TAG_MESSAGE: configuration-check
      - name: Check simple GoReleaser configuration
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          version: v2.17.0
          args: check --config=.goreleaser.simple.yaml
        env:
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_OWNER_LOWER: ${{ github.repository_owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          TAG_MESSAGE: configuration-check
